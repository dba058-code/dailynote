<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A18" media="(prefers-color-scheme: dark)">
<title>하루</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --paper:#F4F5F0;
  --ink:#1F2421;
  --rule:#D9DDD2;
  --rule-soft:#E6E9E0;
  --muted:#7B8279;
  --accent:#2F6F5E;
  --alert:#A9512F;
  --field:#FBFBF8;
  --line-h:32px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#171A18;
    --ink:#E4E7E0;
    --rule:#2E332E;
    --rule-soft:#242825;
    --muted:#828A80;
    --accent:#6FB6A0;
    --alert:#D08A6C;
    --field:#1C201D;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- 상단 ---------- */
header{padding:14px 18px 0;flex:0 0 auto}
.monthbar{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);letter-spacing:.06em}
.monthbar button{padding:4px 8px;font-size:1rem;line-height:1;color:var(--muted)}
.monthbar .label{font-variant-numeric:tabular-nums}
.monthbar .spacer{flex:1}
.iconbtn{padding:6px 8px;font-size:1.05rem;color:var(--muted)}

/* 원고지 한 줄 = 이번 달 */
.strip{
  display:flex;gap:4px;margin:12px -18px 0;padding:2px 18px 8px;
  overflow-x:auto;scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.cell{
  flex:0 0 auto;width:26px;height:26px;border:1px solid var(--rule);
  border-radius:2px;background:transparent;color:var(--muted);
  font-size:.62rem;font-variant-numeric:tabular-nums;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:0 2px 1px 0;transition:background .18s ease,color .18s ease;
}
.cell.filled{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.cell.today{border-color:var(--ink);border-width:1.5px;color:var(--ink)}
.cell.today.filled{color:var(--paper)}
.cell.current{box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink)}

/* 날짜 */
.datehead{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.daynum{
  font-family:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;
  font-size:3.2rem;line-height:.9;font-weight:500;letter-spacing:-.03em;
}
.daymeta{display:flex;flex-direction:column;gap:3px}
.dow{font-size:.95rem;letter-spacing:.22em;color:var(--muted)}
.status{font-size:.7rem;letter-spacing:.1em;color:var(--accent);opacity:0;transition:opacity .3s ease}
.status.on{opacity:1}
.rules{margin:12px 0 0;border-top:1px solid var(--ink);height:3px;border-bottom:1px solid var(--rule)}

/* ---------- 본문 ---------- */
main{flex:1 1 auto;min-height:0;display:flex;padding:0 18px}
textarea{
  flex:1;width:100%;border:0;resize:none;background:var(--field);
  color:var(--ink);font:inherit;font-size:16px;line-height:var(--line-h);
  padding:6px 10px 40vh;margin:0;outline:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--line-h) - 1px),var(--rule-soft) calc(var(--line-h) - 1px) var(--line-h));
  background-attachment:local;background-position:0 6px;
}
textarea::placeholder{color:var(--muted);opacity:.7}

/* ---------- 하단 ---------- */
nav{
  flex:0 0 auto;display:flex;align-items:center;border-top:1px solid var(--rule);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--paper);
}
nav button{flex:1;padding:12px 4px;font-size:.88rem;color:var(--muted);letter-spacing:.04em}
nav button.today{color:var(--ink);font-weight:600}

/* ---------- 알림 바 ---------- */
.notice{
  display:none;align-items:center;gap:10px;margin:10px 18px 0;padding:9px 12px;
  border:1px solid var(--alert);border-radius:4px;font-size:.8rem;color:var(--alert);
}
.notice.on{display:flex}
.notice span{flex:1}
.notice button{text-decoration:underline;font-size:.8rem;color:var(--alert)}

/* ---------- 시트 ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--rule);border-radius:12px 12px 0 0;
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));display:none;
}
.sheet.on{display:block}
.sheet h2{margin:8px 20px 12px;font-size:.75rem;letter-spacing:.18em;color:var(--muted);font-weight:500}
.sheet button,.sheet label{
  display:block;width:100%;text-align:left;padding:14px 20px;font-size:.95rem;
}
.sheet .sub{display:block;font-size:.74rem;color:var(--muted);margin-top:3px}
.sheet input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="monthbar">
    <button id="prevMonth" aria-label="이전 달">‹</button>
    <span class="label" id="monthLabel"></span>
    <button id="nextMonth" aria-label="다음 달">›</button>
    <span class="spacer"></span>
    <button class="iconbtn" id="pickBtn" aria-label="날짜 선택">달력</button>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="datehead">
    <div class="daynum" id="dayNum">00</div>
    <div class="daymeta">
      <div class="dow" id="dow">—</div>
      <div class="status" id="status">저장됨</div>
    </div>
  </div>
  <div class="rules"></div>
</header>

<div class="notice" id="notice">
  <span id="noticeText"></span>
  <button id="noticeAct">내보내기</button>
</div>

<main>
  <textarea id="editor" placeholder="오늘 있었던 일을 적어보세요." spellcheck="false"></textarea>
</main>

<nav>
  <button id="prevDay">‹ 어제</button>
  <button id="todayBtn" class="today">오늘</button>
  <button id="nextDay">내일 ›</button>
</nav>

<input type="date" id="datePicker" style="position:fixed;opacity:0;pointer-events:none;left:16px;bottom:60px">

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <h2>데이터</h2>
  <button id="exportBtn">내보내기<span class="sub" id="exportSub">전체 기록을 JSON 파일로 저장합니다</span></button>
  <label for="importFile">가져오기<span class="sub">JSON 파일을 불러와 합칩니다</span></label>
  <input type="file" id="importFile" accept="application/json,.json">
  <button id="closeSheet">닫기</button>
</div>

<script>
'use strict';

/* ============ 저장소 ============ */
const DB_NAME = 'dailynote', DB_VER = 1, STORE = 'entries';
let dbp = null;

function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const s = db.createObjectStore(STORE, { keyPath: 'id' });
        s.createIndex('date', 'date');
        s.createIndex('type', 'type');
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbp;
}

async function tx(mode, fn){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out.result);
    t.onerror = () => rej(t.error);
  });
}

const store = {
  get:   id   => tx('readonly',  s => s.get(id)),
  put:   obj  => tx('readwrite', s => s.put(obj)),
  del:   id   => tx('readwrite', s => s.delete(id)),
  all:   ()   => tx('readonly',  s => s.getAll()),
  range: (a,b)=> tx('readonly',  s => s.index('date').getAll(IDBKeyRange.bound(a, b)))
};

/* ============ 날짜 ============ */
const DOW = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());

/* ============ 상태 ============ */
let current = todayStr();      // 보고 있는 날짜
let saveTimer = null;
let loadedText = '';

const $ = id => document.getElementById(id);
const editor = $('editor');

/* ============ 렌더 ============ */
async function render(){
  const d = parse(current);
  $('dayNum').textContent = pad(d.getDate());
  $('dow').textContent = DOW[d.getDay()];
  $('monthLabel').textContent = `${d.getFullYear()}. ${pad(d.getMonth()+1)}`;

  const entry = await store.get('memo-' + current);
  loadedText = entry ? entry.text : '';
  editor.value = loadedText;

  await renderStrip(d);

  if (current === todayStr() && !loadedText) {
    editor.focus();
  }
}

async function renderStrip(d){
  const y = d.getFullYear(), m = d.getMonth();
  const last = new Date(y, m+1, 0).getDate();
  const from = `${y}-${pad(m+1)}-01`, to = `${y}-${pad(m+1)}-${pad(last)}`;
  const rows = await store.range(from, to);
  const written = new Set(rows.filter(r => r.type === 'memo' && r.text.trim()).map(r => r.date));

  const strip = $('strip');
  strip.innerHTML = '';
  let currentEl = null;
  for (let i = 1; i <= last; i++) {
    const key = `${y}-${pad(m+1)}-${pad(i)}`;
    const b = document.createElement('button');
    b.className = 'cell';
    b.textContent = i;
    b.setAttribute('aria-label', `${m+1}월 ${i}일`);
    if (written.has(key)) b.classList.add('filled');
    if (key === todayStr()) b.classList.add('today');
    if (key === current) { b.classList.add('current'); currentEl = b; }
    b.onclick = () => go(key);
    strip.appendChild(b);
  }
  if (currentEl) currentEl.scrollIntoView({ inline:'center', block:'nearest' });
}

function flash(msg){
  const el = $('status');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ============ 이동 ============ */
async function go(dateStr){
  await saveNow();
  current = dateStr;
  await render();
}
function shift(days){
  const d = parse(current);
  d.setDate(d.getDate() + days);
  go(ymd(d));
}

/* ============ 저장 ============ */
async function saveNow(){
  const text = editor.value;
  if (text === loadedText) return;
  const id = 'memo-' + current;
  const now = new Date().toISOString();
  if (!text.trim()) {
    await store.del(id);
  } else {
    const prev = await store.get(id);
    await store.put({
      id, date: current, type: 'memo', text,
      amount: null, category: null, tags: [],
      created: prev ? prev.created : now, updated: now
    });
  }
  loadedText = text;
  flash('저장됨');
  renderStrip(parse(current));
}

editor.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
});
window.addEventListener('blur', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ============ 내보내기 / 가져오기 ============ */
async function exportData(){
  const entries = await store.all();
  if (!entries.length) { flash('기록 없음'); return; }
  const payload = { app:'dailynote', version:1, exportedAt:new Date().toISOString(), entries };
  const name = `dailynote-${todayStr()}.json`;
  const file = new File([JSON.stringify(payload, null, 2)], name, { type:'application/json' });

  function downloadFallback(){
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:name });
    } else {
      downloadFallback();
    }
    localStorage.setItem('lastBackup', new Date().toISOString());
    checkBackup();
    closeSheet();
    flash('내보냄');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    // 공유가 지원된다고 나왔지만 실제로 실패한 경우 → 다운로드로 대체
    try {
      downloadFallback();
      localStorage.setItem('lastBackup', new Date().toISOString());
      checkBackup();
      closeSheet();
      flash('파일로 저장됨');
      return;
    } catch (e2) { /* 아래 알림으로 진행 */ }
    flash('내보내기 실패');
  }
}

async function importData(file){
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.entries)) throw new Error('형식이 다릅니다');
    let added = 0;
    for (const e of data.entries) {
      if (!e.id || !e.date) continue;
      const prev = await store.get(e.id);
      if (!prev || (e.updated || '') > (prev.updated || '')) { await store.put(e); added++; }
    }
    closeSheet();
    await render();
    flash(`${added}건 반영`);
  } catch (err) {
    alert('가져오지 못했습니다: ' + err.message);
  }
}

/* ============ 백업 알림 ============ */
async function checkBackup(){
  const entries = await store.all();
  const last = localStorage.getItem('lastBackup');
  const days = last ? (Date.now() - new Date(last)) / 864e5 : Infinity;
  const need = entries.length > 0 && days > 7;
  $('notice').classList.toggle('on', need);
  $('noticeText').textContent = last
    ? `마지막 백업 ${Math.floor(days)}일 전`
    : '아직 백업한 적이 없습니다';
  $('exportSub').textContent = last
    ? `마지막 백업 ${Math.floor(days)}일 전`
    : '전체 기록을 JSON 파일로 저장합니다';
}

/* ============ 시트 ============ */
function openSheet(){ $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }

/* ============ 이벤트 ============ */
$('prevDay').onclick   = () => shift(-1);
$('nextDay').onclick   = () => shift(1);
$('todayBtn').onclick  = () => go(todayStr());
$('prevMonth').onclick = () => { const d = parse(current); d.setMonth(d.getMonth()-1, 1); go(ymd(d)); };
$('nextMonth').onclick = () => { const d = parse(current); d.setMonth(d.getMonth()+1, 1); go(ymd(d)); };
$('menuBtn').onclick   = openSheet;
$('closeSheet').onclick= closeSheet;
$('scrim').onclick     = closeSheet;
$('exportBtn').onclick = exportData;
$('noticeAct').onclick = exportData;
$('importFile').onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; };
$('pickBtn').onclick = () => { const p = $('datePicker'); p.value = current; p.showPicker ? p.showPicker() : p.click(); };
$('datePicker').onchange = e => { if (e.target.value) go(e.target.value); };

document.addEventListener('keydown', e => {
  if (e.target === editor) return;
  if (e.key === 'ArrowLeft')  shift(-1);
  if (e.key === 'ArrowRight') shift(1);
});

/* ============ 시작 ============ */
(async function init(){
  if (navigator.storage && navigator.storage.persist) {
    const already = await navigator.storage.persisted();
    if (!already) await navigator.storage.persist();
  }
  await render();
  await checkBackup();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
